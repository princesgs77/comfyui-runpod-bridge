<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComfyUI Remote</title>
  <style>
    body {
      max-width: 760px;
      margin: 50px auto;
      padding: 20px;
      background: #171717;
      color: #f5f5f5;
      font: 16px system-ui;
    }
    input, button {
      margin: 10px 0;
      padding: 12px;
    }
    input { max-width: 100%; }
    button { cursor: pointer; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #252525;
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>ComfyUI Remote</h1>
  <p>Submit a workflow to your RunPod Serverless endpoint.</p>

  <label>
    Bridge access token
    <input id="token" type="password" autocomplete="off">
  </label>
  <br>
  <input id="workflow" type="file" accept=".json">
  <br>
  <button id="run">Submit workflow</button>
  <button id="check">Check job status</button>
  <pre id="result">Ready</pre>

  <script>
    let jobId = "";
    const result = document.getElementById("result");

    function headers() {
      return {
        Authorization:
          "Bearer " + document.getElementById("token").value,
        "Content-Type": "application/json"
      };
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { ...headers(), ...options.headers }
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(JSON.stringify(data));
      }

      return data;
    }

    document.getElementById("run").onclick = async () => {
      try {
        const file = document.getElementById("workflow").files[0];
        if (!file) throw new Error("Select an API workflow JSON file.");

        const workflow = JSON.parse(await file.text());
        result.textContent = "Submitting...";

        const data = await request("/api/run", {
          method: "POST",
          body: JSON.stringify({ workflow })
        });

        jobId = data.id;
        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = error.message;
      }
    };

    document.getElementById("check").onclick = async () => {
      try {
        if (!jobId) throw new Error("Submit a job first.");

        const data = await request(
          "/api/status/" + encodeURIComponent(jobId)
        );

        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = error.message;
      }
    };
  </script>
</body>
</html>
